<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&amp;D Operations — St Regis Le Morne Resort, Mauritius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152431;
    --ink-soft:#2b3f52;
    --ivory:#F7F3EA;
    --ivory-dim:#EFE9DA;
    --card:#FFFFFF;
    --gold:#A9832E;
    --gold-soft:#DDC98A;
    --sage:#6B8F5E;
    --sage-bg:#E7EEE2;
    --rust:#B4573D;
    --rust-bg:#F3E3DD;
    --amber:#C89B3C;
    --amber-bg:#F6EBD3;
    --line:#E1D9C6;
    --text:#2A2520;
    --text-dim:#6B6459;
    --btn-bg:#152431;
    --ctl-text:#152431;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ivory:#171310;
      --ivory-dim:#1E1A15;
      --card:#221D17;
      --text:#EFE7D8;
      --text-dim:#A79C87;
      --line:#3A3226;
      --btn-bg:#A9832E;
      --ctl-text:#EFE7D8;
    }
  }
  :root[data-theme="dark"]{
    --ivory:#171310;
    --ivory-dim:#1E1A15;
    --card:#221D17;
    --text:#EFE7D8;
    --text-dim:#A79C87;
    --line:#3A3226;
    --btn-bg:#A9832E;
    --ctl-text:#EFE7D8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--gold-soft);border-radius:6px;}

  /* Top menu bar */
  .sidebar{
    width:100%;
    background:var(--ink);
    color:#EDE7D8;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:6px 26px;
    padding:8px 36px;
    position:sticky;
    top:0;
    z-index:30;
    box-shadow:0 2px 10px rgba(21,36,49,0.2);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
    text-align:left;
    padding:0 26px 0 0;
    margin:0;
    border-right:1px solid rgba(237,231,216,0.18);
  }
  .modal-head{margin:-28px -28px 20px -28px;padding:14px 20px;background:var(--ink);border-radius:12px 12px 0 0;text-align:center;}
  .doc-logo{display:block;height:72px;width:auto;margin:0 auto;}
  .brand-logo{display:block;height:58px;width:auto;margin:0;}
  .brand-text{
    font-family:'Inter',sans-serif;
    font-size:.66rem;
    font-weight:600;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold-soft);
    line-height:1.6;
  }
  nav{display:flex;flex-direction:row;flex-wrap:wrap;gap:2px;}
  .nav-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:#CFC7B4;
    font-family:'Inter',sans-serif;
    font-size:.88rem;
    font-weight:500;
    white-space:nowrap;
    padding:22px 15px;
    border-radius:0;
    box-shadow:inset 0 -3px 0 transparent;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .nav-btn:hover{background:rgba(237,231,216,0.06);color:#fff;}
  .nav-btn.active{background:none;color:#fff;box-shadow:inset 0 -3px 0 var(--gold);}
  .nav-btn .dot{display:none;}
  .nav-badge{
    margin-left:2px;
    background:var(--rust);
    color:#fff;
    font-size:.68rem;
    font-weight:700;
    padding:1px 6px;
    border-radius:20px;
    min-width:16px;
    text-align:center;
  }
  .sidebar-foot{
    margin:0 0 0 auto;
    padding:0;
    border:none;
    font-size:.7rem;
    color:#8C8471;
    line-height:1.5;
    max-width:230px;
    text-align:right;
  }

  /* Main */
  main{
    width:100%;
    max-width:1240px;
    margin:0 auto;
    padding:32px 40px 48px;
  }

  .page-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:28px;
    gap:20px;
    flex-wrap:wrap;
  }
  .page-head h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.7rem;
    margin:0 0 4px 0;
  }
  .page-head p{
    margin:0;
    color:var(--text-dim);
    font-size:.92rem;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-size:.85rem;
    font-weight:600;
    padding:10px 18px;
    border-radius:7px;
    border:1px solid var(--btn-bg);
    background:var(--btn-bg);
    color:#fff;
    cursor:pointer;
    transition:opacity .15s ease;
    white-space:nowrap;
  }
  .btn:hover{opacity:.85;}
  .btn.secondary{
    background:transparent;
    color:var(--ctl-text);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{background:var(--ivory-dim);opacity:1;}
  .btn.small{padding:6px 12px;font-size:.78rem;}
  .btn.danger{background:var(--rust);border-color:var(--rust);}
  .btn.ghost{background:none;border:none;color:var(--text-dim);padding:4px 6px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
  }

  /* Calendar */
  .cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.25rem;margin:0;}
  .cal-nav{display:flex;gap:6px;align-items:center;}
  .cal-nav button{
    background:none;border:1px solid var(--line);width:30px;height:30px;border-radius:6px;
    cursor:pointer;font-size:.9rem;color:var(--ctl-text);
  }
  .cal-nav button:hover{background:var(--ivory-dim);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:.68rem;font-weight:700;letter-spacing:.05em;color:var(--text-dim);text-align:center;padding-bottom:4px;}
  .cal-cell{
    min-height:84px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px;
    background:var(--ivory);
    cursor:pointer;
    position:relative;
    transition:background .12s ease, border-color .12s ease;
  }
  .cal-cell:hover{border-color:var(--gold);}
  .cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cal-cell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .cal-cell.selected{background:var(--ink);border-color:var(--ink);}
  .cal-cell.selected .cal-daynum{color:#fff;}
  .cal-daynum{font-size:.78rem;font-weight:600;color:var(--text);}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}
  .cal-dot.groom{background:var(--gold);}
  .cal-dot.train{background:var(--sage);}
  .cal-dot.appr{background:var(--rust);}

  .day-panel h3{font-family:'Fraunces',serif;font-weight:500;font-size:1.05rem;margin:0 0 4px 0;}
  .day-panel .sub{font-size:.78rem;color:var(--text-dim);margin-bottom:14px;}
  .day-item{
    display:flex;gap:9px;align-items:flex-start;
    padding:9px 0;border-bottom:1px solid var(--line);
    font-size:.83rem;
  }
  .day-item:last-child{border-bottom:none;}
  .tag{
    font-size:.65rem;font-weight:700;letter-spacing:.03em;
    padding:2px 7px;border-radius:20px;flex-shrink:0;margin-top:1px;
  }
  .tag.groom{background:var(--amber-bg);color:#8C6A1E;}
  .tag.train{background:var(--sage-bg);color:#3F5A35;}
  .tag.appr{background:var(--rust-bg);color:#8C3E29;}
  .emp-link{color:var(--gold);font-weight:600;text-decoration:none;}
  .emp-link:hover{text-decoration:underline;}
  .empty-note{font-size:.83rem;color:var(--text-dim);padding:8px 0;}

  /* Legend */
  .legend{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
  .legend span{font-size:.76rem;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .legend .cal-dot{width:8px;height:8px;}

  /* Tables / lists */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  select, input[type=text], input[type=date], input[type=time], textarea{
    font-family:'Inter',sans-serif;
    font-size:.84rem;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
  }
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  thead th{
    text-align:left;font-size:.68rem;font-weight:700;letter-spacing:.05em;
    color:var(--text-dim);padding:0 12px 10px 12px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--ivory-dim);}
  .status-pill{
    display:inline-block;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px;
  }
  .status-pill.pass, .status-pill.approved{background:var(--sage-bg);color:#3F5A35;}
  .status-pill.fail, .status-pill.rejected{background:var(--rust-bg);color:#8C3E29;}
  .status-pill.pending{background:var(--amber-bg);color:#8C6A1E;}
  .score{font-weight:700;}
  .muted{color:var(--text-dim);font-size:.78rem;}
  .empty-state{
    text-align:center;padding:50px 20px;color:var(--text-dim);font-size:.88rem;
  }
  .empty-state .big{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--text);margin-bottom:6px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(21,36,49,0.5);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);border-radius:12px;padding:28px;width:100%;max-width:520px;
    max-height:88vh;overflow-y:auto;
  }
  .modal h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.25rem;margin:0 0 18px 0;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
  .field select, .field input, .field textarea{width:100%;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .checklist-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem;}
  .checklist-item:last-child{border-bottom:none;}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  .seg button{
    border:none;background:var(--card);padding:5px 12px;font-size:.75rem;font-weight:600;
    cursor:pointer;color:var(--text-dim);
  }
  .seg button.on.pass{background:var(--sage-bg);color:#3F5A35;}
  .seg button.on.fail{background:var(--rust-bg);color:#8C3E29;}
  .seg button.on.na{background:var(--ivory-dim);color:var(--text);}
  .seg button.on.sel{background:var(--btn-bg);color:#fff;}
  .status-pill.na{background:var(--ivory-dim);color:var(--text-dim);}
  .ci-main{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .ci-note{margin-top:8px;}
  .remark-btn{background:none;border:none;padding:3px 0 0 0;font-family:'Inter',sans-serif;font-size:.72rem;font-weight:600;color:var(--gold);cursor:pointer;}
  .remark-btn:hover{text-decoration:underline;}
  .ci-note input{width:100%;}
  .checklist-item.missing{background:var(--rust-bg);border-radius:6px;padding-left:8px;padding-right:8px;}
  .audit-sec{margin-bottom:16px;}
  .audit-sec-title{font-family:'Fraunces',serif;font-size:1rem;font-weight:500;margin:6px 0 2px 0;padding-bottom:6px;border-bottom:2px solid var(--gold-soft);}
  .dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
  .chip{display:flex;align-items:center;gap:7px;font-size:.8rem;padding:6px 9px;border:1px solid var(--line);border-radius:7px;cursor:pointer;}
  .field .chip input, .chip input{width:auto;flex:none;margin:0;}
  .detail-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem;}
  .report-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 12px 0;}
  .report-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.25rem;margin:0;}
  .report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px;}
  .report-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}
  .report-card.wide{grid-column:1 / -1;}
  .report-card h3{font-family:'Fraunces',serif;font-weight:500;font-size:1rem;margin:0 0 2px 0;}
  .report-card .sub{font-size:.74rem;color:var(--text-dim);margin-bottom:14px;}
  .bar-row{display:grid;grid-template-columns:minmax(96px,170px) 1fr 46px;gap:10px;align-items:center;margin:10px 0;font-size:.8rem;}
  .bar-label small{display:block;color:var(--text-dim);font-size:.7rem;}
  .bar-track{background:var(--ivory-dim);height:10px;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-val{font-weight:700;text-align:right;}
  .donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .donut-wrap svg{flex-shrink:0;}
  .legend-list{display:flex;flex-direction:column;gap:10px;font-size:.82rem;}
  .legend-list i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;}
  .cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:18px;}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
  .col-stack{width:100%;max-width:46px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:5px 5px 0 0;overflow:hidden;}
  .col-n{font-size:.72rem;font-weight:700;margin-bottom:4px;}
  .col-lbl{font-size:.7rem;color:var(--text-dim);margin-top:6px;}
  .report-empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--text-dim);font-size:.85rem;margin-bottom:24px;}
  @media (max-width:960px){ .report-grid{grid-template-columns:1fr;} }
  .btn.secondary.ok{border-color:var(--sage);color:var(--sage);}
  .btn.secondary.no{border-color:var(--rust);color:var(--rust);}
  .settings-btn{margin-left:0;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .list-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .list-tools input[type=text]{flex:1 1 240px;max-width:380px;}
  .kpi.link{cursor:pointer;transition:border-color .15s ease, transform .15s ease;}
  .kpi.link:hover{border-color:var(--gold);transform:translateY(-1px);}
  .setting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .setting-label{font-size:.9rem;font-weight:600;}
  .setting-label small{display:block;font-weight:400;font-size:.75rem;color:var(--text-dim);margin-top:2px;}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:90;box-shadow:0 6px 24px rgba(21,36,49,0.3);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .progress{font-size:.75rem;font-weight:600;color:var(--text-dim);}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .kpi .num{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:500;}
  .kpi .lbl{font-size:.74rem;color:var(--text-dim);margin-top:2px;}

  /* Admin */
  .dept-lock-note{font-size:.72rem;color:var(--text-dim);margin-top:4px;}
  .search-box{position:relative;}
  .search-results{
    position:absolute;top:100%;left:0;right:0;z-index:10;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,0.08);
  }
  .search-result{
    display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:.85rem;
  }
  .search-result:hover{background:var(--ivory-dim);}
  .search-result img{width:22px;height:22px;border-radius:50%;flex-shrink:0;}
  .member-row{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
  }
  .member-row:last-child{border-bottom:none;}
  .member-row img{width:28px;height:28px;border-radius:50%;flex-shrink:0;}
  .member-row .name{font-weight:600;font-size:.86rem;}
  .member-row .dept-badge{
    font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;
    background:var(--amber-bg);color:#8C6A1E;margin-left:auto;
  }
  .banner{
    background:var(--amber-bg);color:#8C6A1E;border-radius:8px;padding:12px 16px;
    font-size:.85rem;margin-bottom:20px;
  }

  @media (max-width:1180px){ .sidebar-foot{display:none;} .settings-btn{margin-left:auto;} }
  @media (min-width:961px){
    body.layout-side{flex-direction:row;}
    body.layout-side .sidebar{width:240px;flex-shrink:0;flex-direction:column;align-items:stretch;gap:0;padding:28px 18px;height:100vh;box-shadow:none;}
    body.layout-side .brand{flex-direction:column;gap:0;text-align:center;padding:0 0 20px 0;margin-bottom:20px;border-right:none;border-bottom:1px solid rgba(237,231,216,0.15);}
    body.layout-side .brand-logo{width:158px;max-width:100%;height:auto;margin:2px auto 14px auto;}
    body.layout-side nav{flex-direction:column;flex-wrap:nowrap;gap:3px;}
    body.layout-side .nav-btn{padding:10px 12px;border-radius:7px;box-shadow:none;gap:10px;}
    body.layout-side .nav-btn:hover{background:rgba(237,231,216,0.07);}
    body.layout-side .nav-btn.active{background:rgba(169,131,46,0.22);box-shadow:none;}
    body.layout-side .nav-btn .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;opacity:0;}
    body.layout-side .nav-btn.active .dot{opacity:1;}
    body.layout-side .nav-badge{margin-left:auto;}
    body.layout-side .settings-btn{order:1;margin-top:auto;margin-left:0;}
    body.layout-side .sidebar-foot{order:2;display:block;margin:12px 0 0 0;padding-top:14px;border-top:1px solid rgba(237,231,216,0.15);max-width:none;text-align:left;}
    body.layout-side main{flex:1;width:auto;max-width:1180px;margin:0;padding:36px 44px;}
  }
  @media (max-width:960px){
    body{flex-direction:column;}
    .sidebar{position:relative;flex-wrap:wrap;padding:8px 14px;gap:0 10px;}
    .brand{padding:0 10px 0 0;border-right:none;}
    .brand-logo{height:46px;}
    .brand-text{display:none;}
    nav{gap:0;order:2;width:100%;}
    .settings-btn{order:1;margin-left:auto;padding:12px 9px;}
    .nav-btn{padding:12px 9px;font-size:.82rem;}
    main{padding:20px 16px 36px;}
    .cal-wrap{grid-template-columns:1fr;}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
  }
  @media (min-width:561px){ .field-row{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<main>
  <div id="view-calendar"></div>
  <div id="view-employees" style="display:none;"></div>
  <div id="view-grooming" style="display:none;"></div>
  <div id="view-training" style="display:none;"></div>
  <div id="view-approvals" style="display:none;"></div>
  <div id="view-admin" style="display:none;"></div>
</main>
<input type="file" id="import-csv" accept=".csv,text/csv" style="display:none;" onchange="handleEmployeeCsv(event)">
<input type="file" id="import-file" accept="application/json,.json" style="display:none;" onchange="handleImportFile(event)">

<!-- Employee modal -->
<div class="overlay" id="empOverlay">
  <div class="modal">
    <h2 id="emp-title">Add employee</h2>
    <div class="field"><label>Full name</label><input type="text" id="em-name" placeholder="Name"></div>
    <div class="field-row">
      <div class="field"><label>Staff ID (optional)</label><input type="text" id="em-code" placeholder="e.g. 1042"></div>
      <div class="field"><label>Department</label>
        <select id="em-dept">
          <option>Front Office</option><option>Housekeeping</option><option>F&amp;B Service</option>
          <option>Culinary</option><option>Spa</option><option>Butler Service</option><option>Security</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Position (optional)</label><input type="text" id="em-role" placeholder="e.g. Butler, Commis Chef"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('empOverlay')">Cancel</button>
      <button class="btn" onclick="saveEmployee()">Save employee</button>
    </div>
  </div>
</div>

<!-- Employee profile modal -->
<div class="overlay" id="profileOverlay">
  <div class="modal" style="max-width:680px;">
    <div id="profile-body"></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('profileOverlay')">Close</button>
    </div>
  </div>
</div>

<!-- Grooming modal -->
<div class="overlay" id="groomOverlay">
  <div class="modal" style="max-width:660px;">
    <div class="modal-head"><img class="doc-logo" alt="The St. Regis Le Morne, Mauritius"></div>
    <h2>Grooming audit</h2>
    <div class="audit-sec-title">Details of grooming audit</div>
    <div class="field-row" style="margin-top:12px;">
      <div class="field"><label>Date of audit *</label><input type="date" id="gm-date"></div>
      <div class="field"><label>Time of audit *</label><input type="time" id="gm-time"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Location of audit *</label><input type="text" id="gm-loc" placeholder="e.g. Staff entrance, Lobby"></div>
      <div class="field"><label>Auditor's name *</label><input type="text" id="gm-auditor" placeholder="Your name"></div>
    </div>
    <div class="field"><label>Name of auditee (host) *</label>
      <select id="gm-emp" onchange="onGroomEmpChange()"></select>
      <input type="text" id="gm-staff" placeholder="Auditee's full name" style="display:none;margin-top:6px;">
    </div>
    <div class="field"><label>Department of auditee * <span style="font-weight:400;">(select up to 2)</span></label>
      <div class="dept-grid" id="gm-depts"></div>
    </div>
    <div class="field"><label>Gender *</label>
      <div class="seg" id="gm-gender" style="display:inline-flex;">
        <button type="button" onclick="setGender('Male')">Male</button>
        <button type="button" onclick="setGender('Female')">Female</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;">
      <span></span><span class="progress" id="gm-progress"></span>
    </div>
    <div id="gm-checklist"></div>
    <div class="field"><label>Additional notes</label><textarea id="gm-notes" rows="2" placeholder="Optional observations"></textarea></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="cancelGrooming()">Cancel</button>
      <button class="btn" onclick="saveGrooming()">Save audit</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal" style="max-width:480px;">
    <h2>Settings</h2>
    <div class="setting-row">
      <div class="setting-label">Menu position<small>The side menu needs a wider screen.</small></div>
      <div class="seg" data-key="menu"><button type="button" data-v="top" onclick="setSetting('menu','top')">Top</button><button type="button" data-v="side" onclick="setSetting('menu','side')">Side</button></div>
    </div>
    <div class="setting-row">
      <div class="setting-label">Appearance<small>Auto follows your device.</small></div>
      <div class="seg" data-key="theme"><button type="button" data-v="auto" onclick="setSetting('theme','auto')">Auto</button><button type="button" data-v="light" onclick="setSetting('theme','light')">Light</button><button type="button" data-v="dark" onclick="setSetting('theme','dark')">Dark</button></div>
    </div>
    <div class="setting-row" style="border-bottom:none;">
      <div class="setting-label">Text size</div>
      <div class="seg" data-key="text"><button type="button" data-v="normal" onclick="setSetting('text','normal')">Normal</button><button type="button" data-v="large" onclick="setSetting('text','large')">Large</button></div>
    </div>
    <p class="muted" style="margin:6px 0 0 0;">Saved on this device.</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal('settingsOverlay')">Done</button></div>
  </div>
</div>

<div class="overlay" id="detailOverlay">

          <option>Front Office</option><option>Housekeeping</option><option>F&amp;B Service</option>

<script>
/* ---------- storage: shared db when available, local fallback otherwise ---------- */
let dbCap = null;
let userCap = null;
let downloadsCap = null;
let usingDb = false;
let data = { grooming: [], training: [], approvals: [], employees: [] };

const LOCAL_KEY = 'lnd-ops-data-v1';
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){ const d = JSON.parse(raw); if(!Array.isArray(d.employees)) d.employees = []; ['grooming','training','approvals','employees'].forEach(k=>{ d[k] = (d[k]||[]).map(normRec); }); return d; }
  }catch(e){ console.warn('local read failed', e); }
  return { grooming: [], training: [], approvals: [], employees: [] };
}
function saveLocal(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }
  catch(e){ console.warn('local write failed', e); }
}

function sortRecords(list){
  return [...list].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b._ts||0)-(a._ts||0));
}
const DEPT_ALIASES = {'F&B Service':'Food & Beverage','Butler Service':'Butler'};
function nd(d){ return DEPT_ALIASES[d] || d; }
function normRec(r){ if(r.dept) r.dept = nd(r.dept); if(Array.isArray(r.depts)) r.depts = r.depts.map(nd); return r; }
function subscribeCollection(name){
  dbCap.collection(name).onSnapshot(snap=>{
    data[name] = sortRecords(snap.docs.map(d=>normRec({id:d.id, ...d.data()})));
    renderAll();
  }, err=>{
    console.warn('db subscribe error', name, err);
  });
}

/* ---------- admin / department scoping ---------- */
let isAdmin = false;
let myId = null;
let myDept = null;
let teamMap = {}; // userId -> {department}

function subscribeTeam(){
  dbCap.collection('team').onSnapshot(snap=>{
    teamMap = {};
    snap.docs.forEach(d=>{ teamMap[d.id] = d.data(); });
    myDept = (myId && teamMap[myId]) ? nd(teamMap[myId].department) : null;
    renderAll();
  }, err=>{ console.warn('team subscribe error', err); });
}

/* Non-admins only see records for their assigned department; admins and
   local (non-shared) mode see everything. This is a display-level filter,
   not a security boundary — the underlying documents are still shared docs. */
function visibleRows(list){
  if(isAdmin || !usingDb) return list;
  if(!myDept) return [];
  return list.filter(r=>deptsOf(r).includes(myDept));
}

function applyDeptLock(selectId){
  const sel = document.getElementById(selectId);
  if(usingDb && !isAdmin && myDept){
    sel.value = myDept;
    sel.disabled = true;
  }else{
    sel.disabled = false;
  }
}

async function initCloud(){
  try{ dbCap = await claude.use('db'); }catch(e){ dbCap = null; }
  try{ userCap = await claude.use('user'); }catch(e){ userCap = null; }
  try{ downloadsCap = await claude.use('downloads'); }catch(e){ downloadsCap = null; }

  const foot = document.getElementById('sidebarFoot');
  if(dbCap){
    usingDb = true;
    subscribeCollection('grooming');
    subscribeCollection('training');
    subscribeCollection('approvals');
    subscribeCollection('employees');
    subscribeTeam();
    foot.textContent = 'Shared with your team.';
  }else{
    data = loadLocal();
    isAdmin = true;
    document.getElementById('adminNavBtn').style.display = 'flex';
    renderAll();
    foot.textContent = 'Data is stored on this device only.';
  }
  if(userCap){
    try{
      const me = await userCap.me();
      myId = me.id || null;
      if(me && me.name){ foot.textContent += ' Signed in as ' + me.name + '.'; }
      if(usingDb){
        const owner = await userCap.isOwner();
        const edit = await userCap.canEdit();
        isAdmin = !!(owner || edit);
        document.getElementById('adminNavBtn').style.display = isAdmin ? 'flex' : 'none';
        myDept = (myId && teamMap[myId]) ? nd(teamMap[myId].department) : null;
      }
      renderAll();
    }catch(e){}
  }
}

const DEFAULT_CHECKLIST = ["Uniform pressed & correct fit","Name badge worn","Grooming/hair standard","Footwear standard","Nails & personal hygiene","Jewellery within policy"];

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ---------- nav ---------- */
const views = ['calendar','employees','grooming','training','approvals','admin'];
function switchView(v){
  views.forEach(x=>{
    document.getElementById('view-'+x).style.display = (x===v)?'block':'none';
  });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  renderAll();
}
document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn');
  if(btn) switchView(btn.dataset.view);
});

/* ============ CALENDAR ============ */
let calYear, calMonth, selectedDate = todayISO();
(function initCal(){
  const t = new Date();
  calYear = t.getFullYear(); calMonth = t.getMonth();
})();

function eventsOnDate(iso){
  const groom = visibleRows(data.grooming).filter(x=>x.date===iso);
  const train = visibleRows(data.training).filter(x=>x.date===iso);
  const appr = visibleRows(data.approvals).filter(x=>x.date===iso);
  return {groom, train, appr};
}

function renderCalendar(){
  const el = document.getElementById('view-calendar');
  const monthName = new Date(calYear, calMonth, 1).toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = eventsOnDate(iso);
    const isToday = iso === todayISO();
    const isSel = iso === selectedDate;
    let dots = '';
    if(ev.groom.length) dots += `<span class="cal-dot groom"></span>`;
    if(ev.train.length) dots += `<span class="cal-dot train"></span>`;
    if(ev.appr.length) dots += `<span class="cal-dot appr"></span>`;
    cells += `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectDate('${iso}')">
      <div class="cal-daynum">${d}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const ev = eventsOnDate(selectedDate);
  const items = [];
  ev.groom.forEach(x=>items.push({tag:'groom',label:'Grooming',text:esc(`${deptsText(x)} — ${x.staff||'—'}`), sub:esc(statusLabel(x.status))}));
  ev.train.forEach(x=>items.push({tag:'train',label:'Training',text:esc(x.topic), sub:esc(x.dept)}));
  ev.appr.forEach(x=>items.push({tag:'appr',label:'Request',text:esc(x.topic), sub:esc(x.status)}));

  const todayStr = todayISO();
  const tAud = visibleRows(data.grooming).filter(r=>r.date===todayStr).length;
  const tTrain = visibleRows(data.training).filter(r=>r.date===todayStr).length;
  const pendReq = visibleRows(data.approvals).filter(r=>r.status==='pending').length;
  const empList = visibleRows(data.employees);
  const dueEmp = empList.filter(e=>dueInfo(e).due).length;
  el.innerHTML = `
    <div class="page-head">
      <div><h1>Calendar</h1><p>Grooming audits, training sessions and requests at a glance.</p></div>
    </div>
    <div class="kpi-row">
      <div class="kpi link" onclick="goTo('grooming')"><div class="num">${tAud}</div><div class="lbl">Audits today</div></div>
      <div class="kpi link" onclick="goTo('training')"><div class="num">${tTrain}</div><div class="lbl">Training sessions today</div></div>
      <div class="kpi link" onclick="goTo('approvals','appr','pending')"><div class="num">${pendReq}</div><div class="lbl">Requests to review</div></div>
      <div class="kpi link" onclick="goTo('employees','emp','due')"><div class="num">${empList.length ? dueEmp : '—'}</div><div class="lbl">${empList.length ? 'Employees needing an audit' : 'Add your employees'}</div></div>
    </div>
    <div class="cal-wrap">
      <div class="card">
        <div class="cal-head">
          <h2>${monthName}</h2>
          <div class="cal-nav">
            <button onclick="shiftMonth(-1)">‹</button>
            <button onclick="goToday()" style="width:auto;padding:0 10px;font-size:.72rem;">Today</button>
            <button onclick="shiftMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-grid">${dow}${cells}</div>
        <div class="legend">
          <span><span class="cal-dot groom"></span>Grooming audit</span>
          <span><span class="cal-dot train"></span>Training session</span>
          <span><span class="cal-dot appr"></span>Training request</span>
        </div>
      </div>
      <div class="card day-panel">
        <h3>${fmtDate(selectedDate)}</h3>
        <div class="sub">${items.length} item${items.length===1?'':'s'} on this day</div>
        ${items.length ? items.map(i=>`
          <div class="day-item">
            <span class="tag ${i.tag}">${i.label}</span>
            <div><div>${i.text}</div><div class="muted">${i.sub||''}</div></div>
          </div>`).join('') : `<div class="empty-note">Nothing logged for this day yet.</div>`}
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px;">
          <button class="btn secondary small" onclick="quickAdd('groom')">+ Grooming audit</button>
          <button class="btn secondary small" onclick="quickAdd('train')">+ Training session</button>
          <button class="btn secondary small" onclick="quickAdd('appr')">+ Training request</button>
        </div>
      </div>
    </div>
  `;
}
function selectDate(iso){ selectedDate = iso; renderCalendar(); }
function shiftMonth(dir){
  calMonth += dir;
  if(calMonth<0){calMonth=11; calYear--;}
  if(calMonth>11){calMonth=0; calYear++;}
  renderCalendar();
}
function goToday(){
  const t = new Date(); calYear=t.getFullYear(); calMonth=t.getMonth(); selectedDate = todayISO();
  renderCalendar();
}
function quickAdd(type){
  if(type==='groom'){ document.getElementById('gm-date').value = selectedDate; buildChecklist(); openModal('groomOverlay'); }
  if(type==='train'){ document.getElementById('tr-date').value = selectedDate; openModal('trainOverlay'); }
  if(type==='appr'){ document.getElementById('ap-date').value = selectedDate; openModal('apprOverlay'); }
}

/* ---------- settings ---------- */
const SETTINGS_KEY = 'lnd-settings';
let settings = { menu:'top', theme:'auto', text:'normal' };
function loadSettings(){
  try{ const raw = localStorage.getItem(SETTINGS_KEY); if(raw) settings = { ...settings, ...JSON.parse(raw) }; }catch(e){}
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
function applySettings(){
  document.body.classList.toggle('layout-side', settings.menu === 'side');
  const root = document.documentElement;
  if(settings.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', settings.theme);
  root.style.fontSize = settings.text === 'large' ? '112.5%' : '';
}
function renderSettings(){
  document.querySelectorAll('#settingsOverlay .seg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>{ b.className = (b.dataset.v === settings[seg.dataset.key]) ? 'on sel' : ''; });
  });
}
function setSetting(k, v){ settings[k] = v; saveSettings(); applySettings(); renderSettings(); }
function openSettings(){ renderSettings(); openModal('settingsOverlay'); }

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- list search & filters ---------- */
const viewFilters = { groom:{q:'',f:'all'}, train:{q:'',f:'all'}, appr:{q:'',f:'all'}, emp:{q:'',f:'all'} };
function filterBar(key, placeholder, opts){
  const st = viewFilters[key];
  return `<div class="list-tools">
    <input type="text" placeholder="${esc(placeholder)}" value="${esc(st.q)}" oninput="setFilter('${key}','q',this.value)">
    <select onchange="setFilter('${key}','f',this.value)">${opts.map(o=>`<option value="${esc(o[0])}" ${st.f===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>
  </div>`;
}
function setFilter(key, field, v){ viewFilters[key][field] = v; applyFilters(key); }
function applyFilters(key){
  const tbl = document.getElementById(key+'-table');
  if(!tbl) return;
  const st = viewFilters[key], q = st.q.trim().toLowerCase();
  let shown = 0;
  tbl.querySelectorAll('tbody tr').forEach(tr=>{
    const ok = (!q || (tr.dataset.search||'').includes(q)) && (st.f === 'all' || tr.dataset.f === st.f);
    tr.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  const none = document.getElementById(key+'-none');
  if(none) none.style.display = shown ? 'none' : 'block';
}
function goTo(view, key, f){
  if(key){ viewFilters[key].f = f; viewFilters[key].q = ''; }
  switchView(view);
}

/* ---------- audit due ---------- */
const AUDIT_DUE_DAYS = 30;
function daysSince(iso){
  return Math.round((new Date(todayISO()+'T00:00:00') - new Date(iso+'T00:00:00')) / 86400000);
}
function dueInfo(emp){
  const st = empStats(emp);
  if(!st.last) return { due:true, days:null, st };
  const d = daysSince(st.last.date);
  return { due: d > AUDIT_DUE_DAYS, days:d, st };
}

/* ---------- CSV export (opens in Excel) ---------- */
function csvCell(v){
  v = (v == null) ? '' : String(v);
  if(/^[=+\-@\t\r]/.test(v)) v = "'" + v;
  return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}
function buildCsv(header, rows){
  return '\uFEFFsep=;\r\n' + [header, ...rows].map(r=>r.map(csvCell).join(';')).join('\r\n') + '\r\n';
}
async function saveTextFile(filename, text, doneMsg){
  if(downloadsCap){
    try{ await downloadsCap.save({ filename, data: text }); if(doneMsg) toast(doneMsg); }
    catch(e){ if(e && e.code === 'declined') return; alert('Could not save the file — try again.'); }
  }else{
    try{
      const blob = new Blob([text], {type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      if(doneMsg) toast(doneMsg);
    }catch(e){ alert('Could not save the file in this view — try again.'); }
  }
}
function plural(n, w){ return n + ' ' + w + (n===1 ? '' : 's'); }
function exportAuditsCsv(){
  const rows = [...visibleRows(data.grooming)].sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a._ts||0)-(b._ts||0));
  const head = ['Date','Time','Location','Auditor','Auditee','Staff ID','Department(s)','Gender','Result','Score', ...AUDIT_ITEMS.map(i=>i.q), 'Item remarks','Additional notes'];
  const body = rows.map(r=>{
    const emp = r.employeeId ? empById(r.employeeId) : null;
    const items = AUDIT_ITEMS.map(it=> (r.form === 2 && r.results) ? resultLabel(r.results[it.id]) : '');
    const remarks = r.itemNotes ? AUDIT_ITEMS.filter(it=>r.itemNotes[it.id]).map(it=>it.q+': '+r.itemNotes[it.id]).join(' | ') : '';
    return [r.date, r.time||'', r.location||'', r.auditor||'', r.staff||'', emp ? (emp.code||'') : '', deptsText(r), r.gender||'', statusLabel(r.status), r.score||'', ...items, remarks, r.notes||''];
  });
  saveTextFile(`grooming-audits-${todayISO()}.csv`, buildCsv(head, body), 'Exported ' + plural(rows.length,'audit'));
}
function exportTrainingCsv(){
  const rows = [...visibleRows(data.training)].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const body = rows.map(r=>[r.date, r.dept, r.topic, r.trainer||'', r.attendees||'', r.notes||'']);
  saveTextFile(`training-log-${todayISO()}.csv`, buildCsv(['Date','Department','Topic','Trainer','Attendees','Notes'], body), 'Exported ' + plural(rows.length,'session'));
}
function exportEmployeesCsv(){
  const rows = [...visibleRows(data.employees)].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const body = rows.map(e=>{
    const info = dueInfo(e), st = info.st;
    return [e.name, e.code||'', e.dept, e.position||'', st.total, st.last ? st.last.date : '', st.last ? statusLabel(st.last.status) : ''];
  });
  saveTextFile(`employees-${todayISO()}.csv`, buildCsv(['Name','Staff ID','Department','Position','Audits','Last audit','Last result'], body), 'Exported ' + plural(rows.length,'employee'));
}

/* ============ GROOMING ============ */
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function empById(id){ return data.employees.find(e=>e.id===id) || null; }

/* Checklist follows the property's Microsoft Form. na:false = no N/A option on the form. */
const AUDIT_SECTIONS = [
  { title:'Uniforms', items:[
    {id:'u1', q:'Uniform as per standards and clean', na:false},
    {id:'u2', q:'Jacket / Pullovers / Cardigans / Waistcoat', na:true},
    {id:'u3', q:'Tie / Scarf / Head scarf', na:true},
    {id:'u4', q:'Tights / Stockings / Socks', na:true},
    {id:'u5', q:'Shoes', na:false},
    {id:'u6', q:'Belt', na:true},
    {id:'u7', q:'Underwear', na:false},
    {id:'u8', q:'Branded hats / Caps', na:true}
  ]},
  { title:'General hygiene and appearance', items:[
    {id:'h1', q:'General hygiene', na:false},
    {id:'h2', q:'Make-up & eyelashes', na:true},
    {id:'h3', q:'Nails', na:false},
    {id:'h4', q:'Tattoos', na:true},
    {id:'h5', q:'Hair & hair accessories', na:true},
    {id:'h6', q:'Beard & moustache', na:true},
    {id:'h7', q:'Lenses / Glasses & sunglasses', na:true}
  ]},
  { title:'Jewellery and accessories', items:[
    {id:'j1', q:'Earrings', na:true},
    {id:'j2', q:'Facial piercings & teeth', na:true},
    {id:'j3', q:'Necklace', na:true},
    {id:'j4', q:'Watches & bracelets / Religious bracelets', na:true},
    {id:'j5', q:'Rings', na:true},
    {id:'j6', q:'Ankle bracelet', na:true}
  ]},
  { title:'Work equipment', items:[
    {id:'w1', q:'Branded name tag & Pride Pin', na:true},
    {id:'w2', q:'Commitment Card (St. Regis pocket card)', na:false},
    {id:'w3', q:'Pens & others', na:true}
  ]}
];
const AUDIT_ITEMS = AUDIT_SECTIONS.flatMap(sec=>sec.items);

let groomState = { answers:{}, notes:{}, gender:null };

function resultLabel(v){ return v==='C' ? 'Compliant' : v==='N' ? 'Non-compliant' : v==='NA' ? 'N/A' : ''; }
function resultClass(v){ return v==='C' ? 'pass' : v==='N' ? 'fail' : 'na'; }
function statusLabel(st){ return st==='pass' ? 'Compliant' : st==='fail' ? 'Non-compliant' : st; }
function deptsOf(r){ return (Array.isArray(r.depts) && r.depts.length) ? r.depts : (r.dept ? [r.dept] : []); }
function deptsText(r){ return deptsOf(r).join(' / ') || '—'; }
function failedItemsOf(r){
  if(Array.isArray(r.failedItems)) return r.failedItems;
  return (r.checklist||[]).map((c,i)=>c==='fail' ? DEFAULT_CHECKLIST[i] : null).filter(Boolean);
}

function buildChecklist(){
  groomState.answers = {}; groomState.notes = {};
  document.getElementById('gm-checklist').innerHTML = AUDIT_SECTIONS.map(sec=>`
    <div class="audit-sec">
      <div class="audit-sec-title">${esc(sec.title)}</div>
      ${sec.items.map(it=>`
      <div class="checklist-item" id="ci-${it.id}">
        <div class="ci-main">
          <div class="ci-label"><span>${esc(it.q)}</span><br><button type="button" class="remark-btn" onclick="toggleNote('${it.id}')">+ Remark</button></div>
          <div class="seg">
            <button type="button" data-v="C" onclick="setAnswer('${it.id}','C')">Compliant</button>
            <button type="button" data-v="N" onclick="setAnswer('${it.id}','N')">Non-compliant</button>
            ${it.na ? `<button type="button" data-v="NA" onclick="setAnswer('${it.id}','NA')">N/A</button>` : ''}
          </div>
        </div>
        <div class="ci-note" style="display:none;"><input type="text" placeholder="Remark (optional)" oninput="groomState.notes['${it.id}']=this.value;updateRemarkBtn('${it.id}')"></div>
      </div>`).join('')}
    </div>`).join('');
  updateProgress();
}
function setAnswer(id, v){
  groomState.answers[id] = v;
  const row = document.getElementById('ci-'+id);
  row.classList.remove('missing');
  row.querySelectorAll('.seg button').forEach(b=>{
    b.className = (b.dataset.v === v) ? ('on ' + resultClass(v)) : '';
  });
  if(v==='N') openNote(id);
  updateProgress();
}
function openNote(id){
  const note = document.querySelector('#ci-'+id+' .ci-note');
  note.style.display = 'block';
  updateRemarkBtn(id);
}
function toggleNote(id){
  const note = document.querySelector('#ci-'+id+' .ci-note');
  const show = note.style.display === 'none';
  note.style.display = show ? 'block' : 'none';
  if(show) note.querySelector('input').focus();
  updateRemarkBtn(id);
}
function updateRemarkBtn(id){
  const row = document.getElementById('ci-'+id);
  const open = row.querySelector('.ci-note').style.display !== 'none';
  const has = !!(groomState.notes[id] || '').trim();
  row.querySelector('.remark-btn').textContent = has ? 'Remark added (edit)' : (open ? 'Hide remark' : '+ Remark');
}
function updateProgress(){
  const el = document.getElementById('gm-progress');
  if(el) el.textContent = `${Object.keys(groomState.answers).length} of ${AUDIT_ITEMS.length} answered`;
}
function setGender(v){
  groomState.gender = v;
  document.querySelectorAll('#gm-gender button').forEach(b=>{ b.className = (b.textContent===v) ? 'on sel' : ''; });
}

function buildDeptChips(){

function onDeptChip(el){

function setGroomDepts(list){ document.querySelectorAll('#gm-depts input').forEach(i=>{ i.checked = list.includes(i.value); }); }
function getGroomDepts(){ return [...document.querySelectorAll('#gm-depts input:checked')].map(i=>i.value); }
function groomDeptLocked(){ return usingDb && !isAdmin && !!myDept; }

function buildEmpSelect(selectedId){

function openGroomingModal(empId){

async function saveGrooming(){
  const date = document.getElementById('gm-date').value;
  const time = document.getElementById('gm-time').value;
  const location = document.getElementById('gm-loc').value.trim();
  const auditor = document.getElementById('gm-auditor').value.trim();
  const notes = document.getElementById('gm-notes').value.trim();
  const empSel = document.getElementById('gm-emp').value;
  const emp = (empSel && empSel !== '__other') ? empById(empSel) : null;
  const staff = emp ? emp.name : document.getElementById('gm-staff').value.trim();
  const depts = getGroomDepts();

  const missing = [];
  if(!date) missing.push('date');
  if(!time) missing.push('time');
  if(!location) missing.push('location');
  if(!auditor) missing.push("auditor's name");
  if(!staff) missing.push('auditee');
  if(!depts.length) missing.push('department');
  if(!groomState.gender) missing.push('gender');
  const unanswered = AUDIT_ITEMS.filter(it=>!groomState.answers[it.id]);
  if(unanswered.length) missing.push(`${unanswered.length} checklist item${unanswered.length===1?'':'s'}`);
  if(missing.length){
    unanswered.forEach(it=>document.getElementById('ci-'+it.id).classList.add('missing'));
    alert('Please complete: ' + missing.join(', ') + '.');
    if(unanswered.length && missing.length===1){
      document.getElementById('ci-'+unanswered[0].id).scrollIntoView({block:'center'});
    }
    return;
  }

  const answers = { ...groomState.answers };
  const compliant = AUDIT_ITEMS.filter(it=>answers[it.id]==='C').length;
  const nonCompliant = AUDIT_ITEMS.filter(it=>answers[it.id]==='N');
  const applicable = AUDIT_ITEMS.filter(it=>answers[it.id]!=='NA').length;
  const itemNotes = {};
  AUDIT_ITEMS.forEach(it=>{ const t = (groomState.notes[it.id]||'').trim(); if(t) itemNotes[it.id] = t; });

  const record = {
    form: 2, date, time, location, auditor, staff,
    employeeId: emp ? emp.id : null,
    dept: depts[0], depts,
    gender: groomState.gender,
    results: answers, itemNotes,
    failedItems: nonCompliant.map(it=>it.q),
    score: `${compliant}/${applicable}`,
    status: nonCompliant.length ? 'fail' : 'pass',
    notes, _ts: Date.now(), createdBy: myId
  };
  try{ localStorage.setItem('lnd-auditor', auditor); }catch(e){}
  if(usingDb){
    try{ await dbCap.collection('grooming').add(record); }
    catch(e){ alert('Could not save — check your connection and try again.'); return; }
  }else{
    data.grooming.unshift({id: uid(), ...record});
    saveLocal(); renderAll();
  }
  closeModal('groomOverlay');
  toast('Audit saved');
}
function cancelGrooming(){
  const touched = Object.keys(groomState.answers).length > 0
    || document.getElementById('gm-loc').value.trim()
    || document.getElementById('gm-notes').value.trim();
  if(touched && !confirm('Discard this audit? Your answers will not be saved.')) return;
  closeModal('groomOverlay');
}
async function deleteGrooming(id){
  if(!confirm('Remove this audit? This cannot be undone.')) return;
  if(usingDb){
    try{ await dbCap.doc('grooming/'+id).delete(); }
    catch(e){ alert('Could not remove — try again.'); }
  }else{
    data.grooming = data.grooming.filter(x=>x.id!==id);
    saveLocal(); renderAll();
  }
}

/* ---------- grooming report (charts) ---------- */
let reportPeriod = 'all';
function localISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function periodStart(){
  const d = new Date();
  if(reportPeriod==='month') return localISO(new Date(d.getFullYear(), d.getMonth(), 1));
  if(reportPeriod==='3m'){ d.setMonth(d.getMonth()-3); return localISO(d); }
  if(reportPeriod==='6m'){ d.setMonth(d.getMonth()-6); return localISO(d); }
  return '';
}
function setReportPeriod(v){ reportPeriod = v; renderGrooming(); }
function rateColor(p){ return p>=90 ? 'var(--sage)' : p>=75 ? 'var(--amber)' : 'var(--rust)'; }
function barRow(label, sub, pct, valText, color){
  return `<div class="bar-row">
    <div class="bar-label">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,pct))}%;background:${color};"></div></div>
    <div class="bar-val">${esc(valText)}</div>
  </div>`;
}
function groomingReportHtml(allRows){
  if(!allRows.length) return `
    <div class="report-head"><h2>Report</h2></div>
    <div class="report-empty">Charts will appear here after your first audit is saved: overall result, audits per month, compliance by department and section, and the most common non-compliance.</div>`;
  const start = periodStart();
  const rows = start ? allRows.filter(r=>(r.date||'') >= start) : allRows;
  const head = `
    <div class="report-head">
      <h2>Report</h2>
      <div><label class="muted" style="margin-right:6px;">Period</label>
        <select onchange="setReportPeriod(this.value)">
          <option value="all" ${reportPeriod==='all'?'selected':''}>All time</option>
          <option value="month" ${reportPeriod==='month'?'selected':''}>This month</option>
          <option value="3m" ${reportPeriod==='3m'?'selected':''}>Last 3 months</option>
          <option value="6m" ${reportPeriod==='6m'?'selected':''}>Last 6 months</option>
        </select>
      </div>
    </div>`;
  if(!rows.length) return head + `<div class="report-empty">No audits in this period.</div>`;

  // overall donut
  const total = rows.length;
  const ok = rows.filter(r=>r.status==='pass').length;
  const bad = total - ok;
  const pct = Math.round(ok/total*100);
  const R = 52, C = 2*Math.PI*R, okLen = ok/total*C;
  const donut = `
    <div class="donut-wrap">
      <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${pct}% of audits fully compliant">
        <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--rust)" stroke-width="16"></circle>
        <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--sage)" stroke-width="16"
          stroke-dasharray="${okLen} ${C-okLen}" transform="rotate(-90 70 70)"></circle>
        <text x="70" y="68" text-anchor="middle" font-family="Fraunces, serif" font-size="26" font-weight="500" fill="var(--text)">${pct}%</text>
        <text x="70" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="var(--text-dim)">FULLY COMPLIANT</text>
      </svg>
      <div class="legend-list">
        <div><i style="background:var(--sage)"></i><b>${ok}</b> fully compliant</div>
        <div><i style="background:var(--rust)"></i><b>${bad}</b> with non-compliance</div>
        <div class="muted">${total} audit${total===1?'':'s'} in total</div>
      </div>
    </div>`;

  // monthly trend (last 6 months, independent of period)
  const now = new Date(), months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()], ok:0, bad:0 });
  }
  allRows.forEach(r=>{
    const m = months.find(x=>x.key === (r.date||'').slice(0,7));
    if(m){ if(r.status==='pass') m.ok++; else m.bad++; }
  });
  const maxM = Math.max(1, ...months.map(m=>m.ok+m.bad));
  const trend = `
    <div class="cols" role="img" aria-label="Audits per month">
      ${months.map(m=>{
        const t = m.ok + m.bad;
        return `<div class="col">
          <div class="col-n">${t || ''}</div>
          <div class="col-stack" style="height:${t/maxM*100}%;">
            ${m.bad ? `<div style="flex:${m.bad};background:var(--rust);"></div>` : ''}
            ${m.ok ? `<div style="flex:${m.ok};background:var(--sage);"></div>` : ''}
          </div>
          <div class="col-lbl">${m.label}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="legend-list" style="flex-direction:row;gap:18px;margin-top:12px;">
      <span><i style="background:var(--sage)"></i>Fully compliant</span>
      <span><i style="background:var(--rust)"></i>With non-compliance</span>
    </div>`;

  // by department
  const deptMap = {};
  rows.forEach(r=>deptsOf(r).forEach(d=>{
    const x = deptMap[d] || (deptMap[d] = { n:0, ok:0 });
    x.n++; if(r.status==='pass') x.ok++;
  }));
  const deptBars = Object.keys(deptMap).sort((a,b)=>deptMap[b].n-deptMap[a].n || a.localeCompare(b)).map(d=>{
    const x = deptMap[d], p = Math.round(x.ok/x.n*100);
    return barRow(d, `${x.n} audit${x.n===1?'':'s'}`, p, p+'%', rateColor(p));
  }).join('');

  // by checklist section (new-format audits only)
  const newRows = rows.filter(r=>r.form===2 && r.results);
  const secBars = newRows.length ? AUDIT_SECTIONS.map(sec=>{
    let c=0, a=0;
    newRows.forEach(r=>sec.items.forEach(it=>{ const v=r.results[it.id]; if(v==='C'){c++;a++;} else if(v==='N'){a++;} }));
    const p = a ? Math.round(c/a*100) : 0;
    return barRow(sec.title, `${c} of ${a} checks`, p, a ? p+'%' : '—', a ? rateColor(p) : 'var(--line)');
  }).join('') : `<div class="muted">Section results appear once audits are done with the new checklist.</div>`;

  // most common non-compliance
  const failMap = {};
  rows.forEach(r=>failedItemsOf(r).forEach(q=>{ failMap[q] = (failMap[q]||0) + 1; }));
  const failList = Object.keys(failMap).sort((a,b)=>failMap[b]-failMap[a] || a.localeCompare(b)).slice(0,8);
  const maxF = failList.length ? failMap[failList[0]] : 1;
  const failBars = failList.length
    ? failList.map(q=>barRow(q, '', failMap[q]/maxF*100, String(failMap[q]), 'var(--rust)')).join('')
    : `<div class="muted">No non-compliance recorded in this period.</div>`;

  return head + `
    <div class="report-grid">
      <div class="report-card"><h3>Overall result</h3><div class="sub">Audits with every item compliant</div>${donut}</div>
      <div class="report-card"><h3>Audits per month</h3><div class="sub">Last 6 months</div>${trend}</div>
      <div class="report-card"><h3>Compliance by department</h3><div class="sub">Share of audits fully compliant</div>${deptBars}</div>
      <div class="report-card"><h3>Compliance by checklist section</h3><div class="sub">Share of checked items that were compliant</div>${secBars}</div>
      <div class="report-card wide"><h3>Most common non-compliance</h3><div class="sub">Where retraining or reminders are needed most</div>${failBars}</div>
    </div>`;
}

/* ============ EMPLOYEES ============ */
let editingEmpId = null;

function auditsFor(emp){
  const nm = (emp.name||'').trim().toLowerCase();
  return data.grooming.filter(g => g.employeeId === emp.id || (!g.employeeId && (g.staff||'').trim().toLowerCase() === nm));
}
function empStats(emp){
  const list = auditsFor(emp);
  const passed = list.filter(g=>g.status==='pass').length;
  const failed = list.filter(g=>g.status==='fail').length;
  const done = passed + failed;
  const last = [...list].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b._ts||0)-(a._ts||0))[0] || null;
  return { total: list.length, passed, failed, rate: done ? Math.round(passed/done*100) : null, last };
}

      else await dbCap.collection('employees').add({ ...fields, _ts: Date.now() });
    }else{
      if(editingEmpId){
        const e = empById(editingEmpId);
        if(e) Object.assign(e, fields);
      }else{
        data.employees.push({ id: uid(), ...fields, _ts: Date.now() });
      }
      saveLocal(); renderAll();
    }
  }catch(e){ alert('Could not save — check your connection and try again.'); return; }
  closeModal('empOverlay');
  toast('Employee saved');
}

async function onMemberSearch(query){
  if(!userCap){ return; }
  let results = [];
  try{ results = await userCap.search(query); }catch(e){ return; }
  const box = document.getElementById('member-results');
  if(!box) return;
  box.innerHTML = '';
  if(!results.length){ box.style.display='none'; return; }
  results.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'search-result';
    const img = document.createElement('img');
    img.src = p.avatarUrl || ''; img.alt = '';
    const span = document.createElement('span');
    span.textContent = p.name || 'Someone';
    row.appendChild(img); row.appendChild(span);
    row.addEventListener('click', ()=>openAssignForm(p));
    box.appendChild(row);
  });
  box.style.display = 'block';
}

let pendingAssign = null;
function openAssignForm(profile){
  pendingAssign = profile;
  const resultsBox = document.getElementById('member-results');
  if(resultsBox) resultsBox.style.display = 'none';
  const searchInput = document.getElementById('member-search');
  if(searchInput) searchInput.value = profile.name || 'Someone';

  const wrap = document.getElementById('member-assign-form');
  wrap.innerHTML = '';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;';

  const label = document.createElement('span');
  label.style.cssText = 'font-size:.85rem;';
  label.textContent = 'Assign ' + (profile.name || 'this person') + ' to:';

  const select = document.createElement('select');
  select.id = 'assign-dept-select';
  ALL_DEPTS.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    select.appendChild(opt);
  });

  const btn = document.createElement('button');
  btn.className = 'btn small';
  btn.textContent = 'Assign';
  btn.onclick = confirmAssign;

  const cancel = document.createElement('button');
  cancel.className = 'btn ghost';
  cancel.textContent = 'Cancel';
  cancel.onclick = ()=>{
    pendingAssign = null;
    wrap.innerHTML = '';
    if(searchInput) searchInput.value = '';
  };

  row.appendChild(label); row.appendChild(select); row.appendChild(btn); row.appendChild(cancel);
  wrap.appendChild(row);
}

async function confirmAssign(){
  if(!pendingAssign || !dbCap) return;
  const select = document.getElementById('assign-dept-select');
  const dept = select ? select.value : ALL_DEPTS[0];
  try{
    await dbCap.doc('team/'+pendingAssign.id).set({ department: dept, addedAt: Date.now() });
  }catch(e){
    alert('Could not assign — try again.');
    return;
  }
  pendingAssign = null;
  const wrap = document.getElementById('member-assign-form');
  if(wrap) wrap.innerHTML = '';
  const searchInput = document.getElementById('member-search');
  if(searchInput) searchInput.value = '';
}

/* ---------- employee CSV import ---------- */
function parseCsv(text){
  text = text.replace(/^\uFEFF/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = { ',': (firstLine.match(/,/g)||[]).length, ';': (firstLine.match(/;/g)||[]).length, '\t': (firstLine.match(/\t/g)||[]).length };
  const delim = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    }else if(c==='"'){ q=true; }
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(cur); cur='';
      if(row.some(x=>x.trim()!=='')) rows.push(row);
      row = [];
    }else cur+=c;
  }
  row.push(cur);
  if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function matchDept(v){
  const t = (v||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!t) return 'Other';
  const hit = ALL_DEPTS.find(d=>d.toLowerCase()===t) || ALL_DEPTS.find(d=>d.toLowerCase()===t.replace(/ and /g,' & '));
  if(hit) return hit;
  if(t.includes('front')) return 'Front Office';
  if(t.includes('house')) return 'Housekeeping';
  if(t.includes('f&b') || t.includes('food') || t.includes('beverage') || t.includes('restaurant')) return 'Food & Beverage';
  if(t.includes('steward')) return 'Stewarding';
  if(t.includes('cul') || t.includes('kitchen') || t.includes('chef')) return 'Culinary';
  if(t.includes('spa')) return 'Spa';
  if(t.includes('butler')) return 'Butler';
  if(t.includes('recre')) return 'Recreation';
  if(t.includes('secur')) return 'Security';
  if(t.includes('engin') || t.includes('maint')) return 'Engineering';
  if(t.includes('land') || t.includes('garden')) return 'Landscaping';
  if(t.includes('admin') || t.includes('office')) return 'Admin';
  return 'Other';
}
async function handleEmployeeCsv(evt){
  const file = evt.target.files && evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  let rows;
  try{ rows = parseCsv(await file.text()); }
  catch(e){ alert('Could not read that file.'); return; }
  if(!rows.length){ alert('That file is empty.'); return; }
  const norm = v => (v||'').trim().toLowerCase().replace(/[^a-z]/g,'');
  const head = rows[0].map(norm);
  const NAME_KEYS = ['name','fullname','employee','employeename','staffname','nom','nomcomplet','employ','nomprnom','nomet prnom'];
  const hasHead = head.some(h=>NAME_KEYS.includes(h));
  let idx = { name:0, code:1, dept:2, position:3 };
  if(hasHead){
    const find = (...keys)=>head.findIndex(h=>keys.includes(h));
    idx = {
      name: find(...NAME_KEYS),
      code: find('staffid','id','employeeid','code','staffno','staffnumber','empid','matricule','numro','numero'),
      dept: find('department','dept','dpartement','departement','service'),
      position: find('position','jobtitle','title','role','poste','fonction','titre')
    };
    rows = rows.slice(1);
  }
  const get = (r,i)=> i>=0 && i<r.length ? r[i].trim() : '';
  const existing = new Set(data.employees.map(e=>(e.name||'').trim().toLowerCase()+'|'+(e.dept||'')));
  const toAdd = []; let skipped = 0;
  rows.forEach(r=>{
    const name = get(r, idx.name);
    if(!name){ return; }
    const dept = matchDept(get(r, idx.dept));
    const key = name.toLowerCase()+'|'+dept;
    if(existing.has(key)){ skipped++; return; }
    existing.add(key);
    toAdd.push({ name, code:get(r,idx.code), position:get(r,idx.position), dept, _ts: Date.now() });
  });
  if(!toAdd.length){ alert(skipped ? 'Everyone in that file is already on your employee list.' : 'No employee names found. Check that the first column is Name.'); return; }
  if(!confirm(`Add ${toAdd.length} employee${toAdd.length===1?'':'s'}${skipped?` (${skipped} already on the list will be skipped)`:''}?`)) return;
  try{
    if(usingDb){ for(const e of toAdd){ await dbCap.collection('employees').add(e); } }
    else{ toAdd.forEach(e=>data.employees.push({ id: uid(), ...e })); saveLocal(); renderAll(); }
  }catch(e){ alert('Import stopped partway through — check the Employees tab, then try again for the rest.'); return; }
  alert(`Added ${toAdd.length} employee${toAdd.length===1?'':'s'}.`);
}

/* ---------- backup: export / import ---------- */

    employees: data.employees, grooming: data.grooming, training: data.training, approvals: data.approvals,
    exportedAt: new Date().toISOString()
  }, null, 2);

}

  const input = document.getElementById('import-file');
  if(input) input.click();
}

async function handleImportFile(evt){
  const file = evt.target.files && evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  let parsed;
  try{
    const text = await file.text();
    parsed = JSON.parse(text);
  }catch(e){
    alert("Could not read that file — make sure it's an export from this app.");
    return;
  }
  const g = Array.isArray(parsed.grooming) ? parsed.grooming : [];
  const t = Array.isArray(parsed.training) ? parsed.training : [];
  const a = Array.isArray(parsed.approvals) ? parsed.approvals : [];
  const em = Array.isArray(parsed.employees) ? parsed.employees : [];
  let count = 0;
  try{
    if(usingDb){
      for(const r of em){ const {id, ...rest} = r; if(id && !empById(id)){ await dbCap.doc('employees/'+id).set(rest); count++; } }
      for(const r of g){ const {id, ...rest} = r; await dbCap.collection('grooming').add(rest); count++; }
      for(const r of t){ const {id, ...rest} = r; await dbCap.collection('training').add(rest); count++; }
      for(const r of a){ const {id, ...rest} = r; await dbCap.collection('approvals').add(rest); count++; }
    }else{
      em.forEach(r=>{ if(r.id && !empById(r.id)){ data.employees.push(r); count++; } });
      g.forEach(r=>{ const {id, ...rest} = r; data.grooming.push({id: uid(), ...rest}); count++; });
      t.forEach(r=>{ const {id, ...rest} = r; data.training.push({id: uid(), ...rest}); count++; });
      a.forEach(r=>{ const {id, ...rest} = r; data.approvals.push({id: uid(), ...rest}); count++; });
      data.employees = sortRecords(data.employees);
      data.grooming = sortRecords(data.grooming);
      data.training = sortRecords(data.training);
      data.approvals = sortRecords(data.approvals);
      saveLocal();
      renderAll();
    }
  }catch(e){
    alert('Import stopped partway through — try again in a moment.');
    return;
  }
  alert(`Imported ${count} record${count===1?'':'s'}.`);
}

async function renderMemberList(){
  const wrap = document.getElementById('member-list');
  if(!wrap) return;
  const ids = Object.keys(teamMap);
  if(!ids.length){
    wrap.innerHTML = '<div class="empty-note">No one assigned yet — search above to add your first team member.</div>';
    return;
  }
  let profiles = {};
  if(userCap){
    try{ profiles = await userCap.profiles(ids); }catch(e){}
  }
  wrap.innerHTML = '';
  ids.forEach(id=>{
    const prof = profiles[id] || {name:'', avatarUrl:''};
    const row = document.createElement('div');
    row.className = 'member-row';
    const img = document.createElement('img');
    img.src = prof.avatarUrl || ''; img.alt = '';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = prof.name || 'Unresolved member';
    const badge = document.createElement('span');
    badge.className = 'dept-badge';
    badge.textContent = (teamMap[id] && teamMap[id].department) || '—';
    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn ghost';
    removeBtn.textContent = 'Remove';
    removeBtn.style.marginLeft = '10px';
    removeBtn.onclick = ()=>removeMember(id);
    row.appendChild(img); row.appendChild(name); row.appendChild(badge); row.appendChild(removeBtn);
    wrap.appendChild(row);
  });
}
